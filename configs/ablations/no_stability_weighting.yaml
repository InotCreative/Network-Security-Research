# Ablation: disable stability weighting in consensus feature selection
# Selector weights are determined by inner-fold macro F1 alone,
# without penalising selectors that produce unstable feature sets
# across inner folds. Tests the value of the stability criterion.
task: multiclass
global_seed: 42
train_path: data/UNSW_NB15_training-set.csv
test_path: data/UNSW_NB15_testing-set.csv
artifact_dir: artifacts
reports_dir: reports
n_outer_folds: 5
n_oof_splits: 7
n_inner_folds: 3
k_grid: [8, 12, 16, 20, 24, 30, 36, 42, 50, 57, 60]
gate_model: auto
ablation:
  no_calibration: false
  no_gate: false
  no_feature_selection: false
  no_engineered_features: false
  simplified_meta_features: false
  no_stability_weighting: true
  fixed_beta: null
