# Ablation: use only raw UNSW-NB15 features, no engineered flow features
task: multiclass
global_seed: 42
train_path: data/UNSW_NB15_training-set.csv
test_path: data/UNSW_NB15_testing-set.csv
artifact_dir: artifacts
reports_dir: reports
n_outer_folds: 5
n_oof_splits: 7
n_inner_folds: 3
k_grid: [8, 12, 16, 20, 24, 30, 36, 42, 50, 57, 60]
gate_model: auto
ablation:
  no_calibration: false
  no_gate: false
  no_feature_selection: false
  no_engineered_features: true
  simplified_meta_features: false
  no_stability_weighting: false
  fixed_beta: null
