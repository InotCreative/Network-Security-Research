# Ablation: stacker path only  (β fixed to 1.0 → p_final = p_stack)
#
# Answers: "Does the two-path design add anything over a plain stacker?"
# Compare p_final here against p_final in no_gate (β=0.5) and
# weighted_avg_only (β=0.0) and the full learned-gate system.
task: multiclass
global_seed: 42
train_path: data/UNSW_NB15_training-set.csv
test_path: data/UNSW_NB15_testing-set.csv
artifact_dir: artifacts
reports_dir: reports
n_outer_folds: 5
n_oof_splits: 7
n_inner_folds: 3
k_grid: [8, 12, 16, 20, 24, 30, 36, 42, 50, 57, 60]
gate_model: auto
ablation:
  no_calibration: false
  no_gate: false
  no_feature_selection: false
  no_engineered_features: false
  simplified_meta_features: false
  no_stability_weighting: false
  fixed_beta: 1.0       # p_final = 1.0*p_stack + 0.0*p_weighted = p_stack
